[build-system]
requires = ["setuptools>=61.0", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "db_specification"
version = "0.0.1"
description = "Api specification for databases"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Kirill", email = "evilprog@yandex.com" }
]
requires-python = ">=3.14"
dependencies = [
    "build",
    "twine",
    "pytest",
]

[project.scripts]
test = "core.cli:test"

[tool.setuptools.packages.find]
where = ["."]
include = ["core"]

[tool.pytest.ini_options]
markers = [
    "slow: slow execution",
    "api: just api tests"
]